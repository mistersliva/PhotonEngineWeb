[package]
name = "photon_engine"
version = "0.4.0"
edition = "2021"
description = "A 3D game engine with wgpu rendering and egui UI (native + web)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
video = ["dep:ffmpeg-next"]

[dependencies]
wgpu = { version = "24", default-features = false, features = ["wgsl", "naga-ir", "webgl"] }
winit = { version = "0.30", features = ["rwh_06"] }
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
raw-window-handle = "0.6"
egui = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["links", "x11"] }
egui-wgpu = "0.31"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = "0.19"
ffmpeg-next = { version = "8.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Performance",
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioDestinationNode",
    "AudioParam",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "AudioNode",
    "Storage",
    "console",
    "Request",
    "Response",
    "Element",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
