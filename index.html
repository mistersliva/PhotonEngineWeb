<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotonEngine</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8ab4f8;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #8ab4f8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        Loading PhotonEngine...
    </div>
    <canvas id="canvas" width="1280" height="720"></canvas>
    <script type="module">
        import init from './pkg/photon_engine.js';

        async function run() {
            const canvas = document.getElementById('canvas');
            const loading = document.getElementById('loading');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            console.log('[PhotonEngine] Canvas sized to', canvas.width, 'x', canvas.height);

            try {
                await init();
                loading.style.display = 'none';
                console.log('[PhotonEngine] Init complete');
            } catch (err) {
                console.error('[PhotonEngine] Init failed:', err);
                loading.innerHTML = '<div style="color: #ff5252;">Error: ' + err.message + '</div>';
            }
        }

        run();
    </script>
</body>
</html>
